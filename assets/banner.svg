<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="glowPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 44px;
        fill: #f8fafc;
        letter-spacing: -0.5px;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #94a3b8;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .badge-tag {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        font-weight: 700;
        fill: #38bdf8;
      }
      /* Animated Elements strictly in background and decorative nodes */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatParticle {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
      }
      @keyframes flowLine {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      .pulse-orb {
        animation: pulseGlow 6s ease-in-out infinite alternate;
        transform-origin: 950px 180px;
      }
      .pulse-orb-2 {
        animation: pulseGlow 8s ease-in-out infinite alternate;
        transform-origin: 200px 300px;
      }
      .wave-line {
        stroke-dasharray: 12 8;
        animation: flowLine 15s linear infinite;
      }
      .floating-node-1 {
        animation: floatParticle 5s ease-in-out infinite;
      }
      .floating-node-2 {
        animation: floatParticle 7s ease-in-out infinite reverse;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Animated Glowing Orbs in Background -->
  <circle class="pulse-orb" cx="950" cy="180" r="160" fill="url(#glowPulse)" />
  <circle class="pulse-orb-2" cx="200" cy="320" r="130" fill="url(#glowPulse)" />

  <!-- Background Network Visual Waves (Decorative) -->
  <g opacity="0.35">
    <path class="wave-line" d="M -50 320 Q 250 260 550 330 T 1250 290" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="wave-line" d="M -50 350 Q 300 390 650 310 T 1250 360" fill="none" stroke="#818cf8" stroke-width="1.5" />
  </g>

  <!-- Right Decorative Telemetry Cards (Behind Foreground text area) -->
  <g transform="translate(780, 70)" class="floating-node-1">
    <rect width="360" height="74" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <circle cx="28" cy="37" r="10" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="2" />
    <text x="50" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="14" fill="#f8fafc">HTTP/3 Inspection &amp; Intercept</text>
    <text x="50" y="52" font-family="monospace" font-size="12" fill="#10b981">200 OK • 1.2ms • 14.8 KB decrypted</text>
  </g>

  <g transform="translate(820, 165)" class="floating-node-2">
    <rect width="340" height="74" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <circle cx="28" cy="37" r="10" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2" />
    <text x="50" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="14" fill="#f8fafc">Distributed Trace Flamegraph</text>
    <text x="50" y="52" font-family="monospace" font-size="12" fill="#38bdf8">p99: 142ms • 38 microservice spans</text>
  </g>

  <g transform="translate(760, 260)" class="floating-node-1">
    <rect width="370" height="74" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <circle cx="28" cy="37" r="10" fill="#f43f5e" fill-opacity="0.2" stroke="#f43f5e" stroke-width="2" />
    <text x="50" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="14" fill="#f8fafc">Production Error &amp; Memory Leak</text>
    <text x="50" y="52" font-family="monospace" font-size="12" fill="#f43f5e">SIGSEGV captured • OOM callstack resolved</text>
  </g>

  <!-- Foreground Content Area (Guaranteed clear & high contrast) -->
  <g transform="translate(60, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 50)">
      <rect width="260" height="28" rx="14" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#38bdf8" />
      <text x="28" y="18" class="badge-tag">CURATED ECOSYSTEM • 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" class="title">
      Developer Debugging &amp;<tspan fill="url(#primaryGrad)"> Network Profiling</tspan>
    </text>

    <!-- Subtitle & Mission -->
    <text x="0" y="172" class="subtitle">
      Top SaaS Platforms &amp; Open-Source Tools for Traffic Interception,
    </text>
    <text x="0" y="198" class="subtitle">
      Distributed Tracing, Flamegraphs, Memory Profiling &amp; Error Tracking.
    </text>

    <!-- Feature Attribute Pills (Foreground, clean separation) -->
    <g transform="translate(0, 246)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="170" height="38" rx="19" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="22" y="24" class="pill-text">🔍 Traffic Proxies</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(182, 0)">
        <rect width="180" height="38" rx="19" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="20" y="24" class="pill-text">⚡ APM &amp; Tracing</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(374, 0)">
        <rect width="170" height="38" rx="19" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="20" y="24" class="pill-text">🔥 Flamegraphs</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(556, 0)">
        <rect width="170" height="38" rx="19" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="20" y="24" class="pill-text">🛡️ Open Source</text>
      </g>
    </g>

    <!-- Bottom Status Text -->
    <g transform="translate(0, 328)">
      <line x1="0" y1="0" x2="680" y2="0" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />
      <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#64748b">
        Inspect HTTP/1/2/3 • OpenTelemetry Native • Real-Time Packet Sniffing • Continuous Profiling
      </text>
    </g>
  </g>
</svg>
